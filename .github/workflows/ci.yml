name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHPUnit + Pint
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: epr_system
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, mysql, sqlite3, curl, zip, bcmath, intl, gd
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Copy env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run Pint (style check)
        run: ./vendor/bin/pint --test

      - name: Run migrations against MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: epr_system
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force

      - name: Seed default data
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: epr_system
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan db:seed --force

      - name: Run PHPUnit (SQLite in-memory, fast)
        run: php artisan test --without-tty
